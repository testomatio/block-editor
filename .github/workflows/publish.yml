name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm 11
        # npm@latest is now v12, which requires Node >=22.22.2 and breaks on the
        # pinned Node 22.14 below. npm 11 supports Node >=22.9 and --provenance.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Update package.json version from git tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance
